<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Publipostage PDF – Widget Grist</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/dsfr.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css"
    />
    <script src="https://docs.getgrist.com/grist-plugin-api.js"></script>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        flex-direction: column;
        background: #f6f6f6;
        overflow: hidden;
      }
      [hidden] {
        display: none !important;
      }

      /* ── Barres du haut ── */
      .barre {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding: 0.5rem 1rem;
        background: #fff;
        flex-wrap: wrap;
      }
      .barre + .barre {
        border-top: 1px solid #eee;
      }
      .barre:last-of-type {
        border-bottom: 1px solid #ddd;
      }
      .barre label {
        font-size: 0.8rem;
        color: #3a3a3a;
        display: flex;
        align-items: center;
        gap: 0.4rem;
        margin: 0;
      }
      .sel {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
        font-size: 0.85rem;
        background: #fff;
        color: #161616;
        max-width: 260px;
      }
      .nav {
        display: flex;
        align-items: center;
        gap: 0.25rem;
      }
      .nav .sel {
        width: 220px;
      }
      #compteur {
        font-size: 0.8rem;
        color: #3a3a3a;
        min-width: 48px;
        text-align: center;
      }
      .actions {
        margin-left: auto;
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      #statut,
      #etat-sauvegarde {
        font-size: 0.8rem;
        color: #666;
      }
      #etat-sauvegarde i {
        font-size: 0.9em;
        margin-right: 0.2rem;
      }

      /* ── Corps ── */
      .corps {
        flex: 1;
        display: flex;
        min-height: 0;
      }
      .panneau {
        width: 250px;
        flex-shrink: 0;
        background: #fff;
        border-right: 1px solid #ddd;
        display: flex;
        flex-direction: column;
        padding: 0.75rem;
        gap: 0.5rem;
        min-height: 0;
      }
      .panneau h2 {
        font-size: 0.9rem;
        margin: 0;
      }
      .panneau .aide {
        font-size: 0.75rem;
        color: #666;
        margin: 0;
      }
      #filtre-champs {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px 8px;
        font: inherit;
        font-size: 0.85rem;
      }
      #liste-champs {
        overflow: auto;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        align-content: flex-start;
        padding-bottom: 0.5rem;
      }
      #liste-champs .fr-tag {
        cursor: pointer;
      }
      #liste-champs .fr-tag i {
        margin-right: 0.25rem;
        font-size: 0.85em;
      }
      .zone {
        flex: 1;
        display: flex;
        flex-direction: column;
        min-width: 0;
      }

      /* ── Barre d'outils de l'éditeur ── */
      .outils {
        display: flex;
        flex-wrap: wrap;
        gap: 2px;
        align-items: center;
        padding: 0.4rem 0.75rem;
        background: #fff;
        border-bottom: 1px solid #ddd;
      }
      .tb {
        border: none !important;
        background: transparent !important;
        width: 30px;
        height: 30px;
        border-radius: 4px !important;
        color: #161616 !important;
        display: inline-flex !important;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-size: 17px !important;
        padding: 0 !important;
        min-height: 0 !important;
      }
      .tb:hover:not(:disabled) {
        background: #eee !important;
      }
      .tb.actif {
        background: #e3e3fd !important;
        color: #000091 !important;
      }
      .tb:disabled {
        opacity: 0.3;
        cursor: default;
      }
      .sep {
        width: 1px;
        height: 20px;
        background: #ddd;
        margin: 0 4px;
      }
      #sel-style {
        width: 120px;
      }

      /* ── Feuille A4 ── */
      .defil {
        flex: 1;
        overflow: auto;
        padding: 24px;
      }
      .feuille {
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
        padding: 20mm;
        box-sizing: border-box;
      }
      .feuille .ProseMirror {
        outline: none;
        min-height: 257mm;
      }
      #apercu {
        display: block;
        width: 210mm;
        min-height: 297mm;
        margin: 0 auto;
        border: 0;
        background: #fff;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.12);
      }
      .feuille .selectedCell {
        background: #e3e3fd !important;
      }
      .feuille .ProseMirror-selectednode {
        outline: 2px solid #000091;
      }
      .feuille .saut-page {
        position: relative;
        height: 0;
        border-top: 2px dashed #929292;
        margin: 8mm 0;
      }
      .feuille .saut-page::after {
        content: "Saut de page";
        position: absolute;
        top: -0.75em;
        left: 50%;
        transform: translateX(-50%);
        background: #fff;
        padding: 0 0.5rem;
        font-size: 0.75rem;
        color: #666;
      }
      .feuille [data-resize-handle] {
        width: 10px;
        height: 10px;
        background: #000091;
        border: 2px solid #fff;
        border-radius: 2px;
        z-index: 2;
      }
      .feuille [data-resize-container]:not(:hover) [data-resize-handle] {
        opacity: 0;
      }
      .feuille .ProseMirror a {
        cursor: pointer;
      }

      /* ── Balises ── */
      .balise {
        display: inline-block;
        background: #e3e3fd;
        color: #000091;
        border-radius: 1rem;
        padding: 0 0.55rem;
        font-size: 0.85em;
        line-height: 1.5;
        font-weight: 500;
        cursor: grab;
        white-space: nowrap;
        user-select: none;
      }
      .balise-orpheline {
        background: #ffe9e9;
        color: #ce0500;
      }

      /* ── Menus flottants ── */
      .pop {
        position: fixed;
        z-index: 1000;
        background: #fff;
        border: 1px solid #ddd;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        padding: 0.5rem;
        border-radius: 4px;
      }
      .pop-emoji {
        display: grid;
        grid-template-columns: repeat(8, 34px);
        gap: 2px;
      }
      .pop-emoji button {
        font-size: 20px;
        width: 34px;
        height: 34px;
        border: 0 !important;
        background: transparent !important;
        cursor: pointer;
        padding: 0 !important;
        border-radius: 4px;
      }
      .pop-emoji button:hover {
        background: #eee !important;
      }
      .pop-lien {
        display: flex;
        gap: 0.5rem;
        align-items: center;
      }
      .pop-lien input {
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 5px 8px;
        font: inherit;
        font-size: 0.85rem;
        width: 280px;
      }
      .galerie {
        display: flex;
        gap: 0.5rem;
        flex-wrap: wrap;
        max-width: 380px;
      }
      .galerie button {
        border: 1px solid #ddd !important;
        background: repeating-conic-gradient(#eee 0 25%, #fff 0 50%) 0 0/12px
          12px !important;
        padding: 2px !important;
        cursor: pointer;
      }
      .galerie button:hover {
        border-color: #000091 !important;
      }
      .galerie img {
        height: 64px;
        display: block;
      }
      .pop .vide {
        font-size: 0.8rem;
        color: #666;
        margin: 0;
        max-width: 260px;
      }
      .suggest {
        padding: 0.25rem;
        min-width: 260px;
        max-height: 280px;
        overflow: auto;
      }
      .suggest-item {
        display: flex;
        gap: 0.5rem;
        align-items: center;
        width: 100%;
        text-align: left;
        border: 0 !important;
        background: transparent !important;
        padding: 0.35rem 0.5rem !important;
        font-size: 0.85rem;
        cursor: pointer;
        color: #161616;
        border-radius: 4px;
      }
      .suggest-item.actif,
      .suggest-item:hover {
        background: #e3e3fd !important;
        color: #000091;
      }
      .suggest-item small {
        margin-left: auto;
        color: #666;
        font-size: 0.7rem;
      }
    </style>
  </head>
  <body>
    <header class="barre">
      <label
        >Modèle
        <select id="sel-modele" class="sel"></select
      ></label>
      <button class="tb" id="btn-nouveau" title="Nouveau modèle">
        <i class="ri-add-line"></i>
      </button>
      <button class="tb" id="btn-dupliquer" title="Dupliquer le modèle">
        <i class="ri-file-copy-line"></i>
      </button>
      <button class="tb" id="btn-renommer" title="Renommer le modèle">
        <i class="ri-edit-line"></i>
      </button>
      <button class="tb" id="btn-supprimer" title="Supprimer le modèle">
        <i class="ri-delete-bin-line"></i>
      </button>
      <span id="etat-sauvegarde"></span>
    </header>

    <header class="barre">
      <label
        >Table source
        <select id="sel-table" class="sel"></select
      ></label>
      <span id="badge-mode" class="fr-badge fr-badge--sm"></span>
      <div class="nav">
        <button class="tb" id="btn-prec" title="Enregistrement précédent">
          <i class="ri-arrow-left-s-line"></i>
        </button>
        <select
          id="sel-rec"
          class="sel"
          title="Enregistrement utilisé pour l'aperçu et l'impression"
        ></select>
        <button class="tb" id="btn-suiv" title="Enregistrement suivant">
          <i class="ri-arrow-right-s-line"></i>
        </button>
        <span id="compteur"></span>
      </div>
      <div class="actions">
        <span id="statut"></span>
        <button
          class="tb"
          id="btn-actualiser"
          title="Recharger modèles, tables, données et images"
        >
          <i class="ri-refresh-line"></i>
        </button>
        <button class="fr-btn fr-btn--sm fr-btn--secondary" id="btn-apercu">
          <i class="ri-eye-line"></i>&nbsp;Aperçu
        </button>
        <button class="fr-btn fr-btn--sm" id="btn-imprimer">
          <i class="ri-printer-line"></i>&nbsp;Imprimer
        </button>
        <button
          class="fr-btn fr-btn--sm fr-btn--tertiary"
          id="btn-imprimer-tout"
        >
          <i class="ri-stack-line"></i>&nbsp;Tout imprimer
        </button>
      </div>
    </header>
    <div id="alerte"></div>

    <div class="corps">
      <aside class="panneau">
        <h2>Champs</h2>
        <input
          id="filtre-champs"
          type="search"
          placeholder="Filtrer les champs"
        />
        <p class="aide">
          Cliquez sur un champ pour l'insérer, ou tapez @ dans le texte.
        </p>
        <div id="liste-champs"></div>
      </aside>

      <section class="zone">
        <div class="outils" id="outils">
          <button class="tb" data-cmd="annuler" title="Annuler (Ctrl+Z)">
            <i class="ri-arrow-go-back-line"></i>
          </button>
          <button class="tb" data-cmd="retablir" title="Rétablir (Ctrl+Y)">
            <i class="ri-arrow-go-forward-line"></i>
          </button>
          <span class="sep"></span>
          <select id="sel-style" class="sel" title="Style du paragraphe">
            <option value="p">Paragraphe</option>
            <option value="1">Titre 1</option>
            <option value="2">Titre 2</option>
            <option value="3">Titre 3</option>
          </select>
          <span class="sep"></span>
          <button class="tb" data-cmd="gras" title="Gras (Ctrl+B)">
            <i class="ri-bold"></i>
          </button>
          <button class="tb" data-cmd="italique" title="Italique (Ctrl+I)">
            <i class="ri-italic"></i>
          </button>
          <button class="tb" data-cmd="souligne" title="Souligné (Ctrl+U)">
            <i class="ri-underline"></i>
          </button>
          <button class="tb" data-cmd="barre" title="Barré">
            <i class="ri-strikethrough"></i>
          </button>
          <span class="sep"></span>
          <button class="tb" data-cmd="gauche" title="Aligner à gauche">
            <i class="ri-align-left"></i>
          </button>
          <button class="tb" data-cmd="centre" title="Centrer">
            <i class="ri-align-center"></i>
          </button>
          <button class="tb" data-cmd="droite" title="Aligner à droite">
            <i class="ri-align-right"></i>
          </button>
          <button class="tb" data-cmd="justifie" title="Justifier">
            <i class="ri-align-justify"></i>
          </button>
          <span class="sep"></span>
          <button class="tb" data-cmd="puces" title="Liste à puces">
            <i class="ri-list-unordered"></i>
          </button>
          <button class="tb" data-cmd="numeros" title="Liste numérotée">
            <i class="ri-list-ordered"></i>
          </button>
          <span class="sep"></span>
          <button class="tb" data-cmd="tableau" title="Insérer un tableau">
            <i class="ri-table-line"></i>
          </button>
          <button
            class="tb"
            data-cmd="ligne"
            data-table
            title="Ajouter une ligne"
          >
            <i class="ri-insert-row-bottom"></i>
          </button>
          <button
            class="tb"
            data-cmd="colonne"
            data-table
            title="Ajouter une colonne"
          >
            <i class="ri-insert-column-right"></i>
          </button>
          <button
            class="tb"
            data-cmd="supprLigne"
            data-table
            title="Supprimer la ligne"
          >
            <i class="ri-delete-row"></i>
          </button>
          <button
            class="tb"
            data-cmd="supprColonne"
            data-table
            title="Supprimer la colonne"
          >
            <i class="ri-delete-column"></i>
          </button>
          <button
            class="tb"
            data-cmd="supprTableau"
            data-table
            title="Supprimer le tableau"
          >
            <i class="ri-delete-bin-line"></i>
          </button>
          <span class="sep"></span>
          <button class="tb" id="btn-lien" title="Insérer ou modifier un lien">
            <i class="ri-link"></i>
          </button>
          <button class="tb" id="btn-images" title="Insérer une image">
            <i class="ri-image-line"></i>
          </button>
          <button class="tb" id="btn-emoji" title="Insérer un emoji">
            <i class="ri-emotion-line"></i>
          </button>
          <button class="tb" data-cmd="saut" title="Saut de page">
            <i class="ri-page-separator"></i>
          </button>
          <button
            class="tb"
            data-cmd="effacer"
            title="Effacer la mise en forme"
          >
            <i class="ri-format-clear"></i>
          </button>
        </div>
        <div class="defil">
          <div class="feuille" id="feuille"><div id="editeur"></div></div>
          <iframe id="apercu" title="Aperçu avec les données" hidden></iframe>
        </div>
      </section>
    </div>

    <div id="pop-lien" class="pop pop-lien" hidden>
      <input
        id="champ-lien"
        type="url"
        placeholder="https://exemple.fr"
        aria-label="Adresse du lien"
      />
      <button class="fr-btn fr-btn--sm" id="btn-lien-ok">Appliquer</button>
      <button class="tb" id="btn-lien-suppr" title="Retirer le lien">
        <i class="ri-link-unlink"></i>
      </button>
    </div>
    <div id="pop-images" class="pop" hidden></div>
    <div id="pop-emoji" class="pop pop-emoji" hidden></div>
    <div id="menu-suggest" class="pop suggest" hidden></div>

    <script type="module">
      // ════════════════════════════════════════════════════════════════
      // Configuration
      // ════════════════════════════════════════════════════════════════
      const TABLE_MODELES = "Modeles_PDF";
      const COLS_MODELE = {
        nom: "Nom",
        contenu: "Contenu",
        tableRef: "Table_cible",
        tableNom: "Table_cible_nom",
        images: "Images",
        mode: "Mode",
        nomFichier: "Nom_fichier",
      };
      const DELAI_SAUVEGARDE = 1500;
      const PIED_GAUCHE = "DRAAF-SRFD Occitanie";
      const TIPTAP_VERSION = "3.31.3";
      const TIPTAP_URLS = {
        core: `https://esm.sh/@tiptap/core@${TIPTAP_VERSION}`,
        starter: `https://esm.sh/@tiptap/starter-kit@${TIPTAP_VERSION}`,
        image: `https://esm.sh/@tiptap/extension-image@${TIPTAP_VERSION}`,
        table: `https://esm.sh/@tiptap/extension-table@${TIPTAP_VERSION}`,
        align: `https://esm.sh/@tiptap/extension-text-align@${TIPTAP_VERSION}`,
        suggestion: `https://esm.sh/@tiptap/suggestion@${TIPTAP_VERSION}`,
      };
      const FONTS_URL =
        "https://cdn.jsdelivr.net/npm/@gouvfr/dsfr@1.13.1/dist/fonts/";
      const EMOJIS =
        "😀 🙂 😉 😊 👍 👏 🙏 👋 ✅ ❌ ⚠️ ❗ ❓ ℹ️ ⭐ 🎉 📄 📋 📌 📎 📅 📆 ⏰ ✉️ 📞 📍 🏫 🎓 📚 ✏️ 🖊️ 💡 🌾 🌱 🌳 🐄 🐑 🐴 🚜 🍇 ➡️ ⬅️ ⬆️ ⬇️ 🔹 🔸 ▶️ 🇫🇷".split(
          " ",
        );
      const ICONES_TYPE = {
        Text: "ri-text",
        Numeric: "ri-hashtag",
        Int: "ri-hashtag",
        Date: "ri-calendar-line",
        DateTime: "ri-time-line",
        Bool: "ri-checkbox-line",
        Choice: "ri-list-check",
        ChoiceList: "ri-list-check-2",
        Ref: "ri-links-line",
        RefList: "ri-links-line",
      };
      const CONTENU_VIDE = {
        type: "doc",
        content: [
          {
            type: "heading",
            attrs: { level: 1 },
            content: [{ type: "text", text: "Titre du document" }],
          },
          {
            type: "paragraph",
            content: [
              {
                type: "text",
                text: "Tapez @ pour insérer un champ, ou cliquez sur un champ dans la colonne de gauche.",
              },
            ],
          },
        ],
      };

      // ════════════════════════════════════════════════════════════════
      // État
      // ════════════════════════════════════════════════════════════════
      const $ = (id) => document.getElementById(id);
      let editor = null;
      let TABLES = []; // { ref, tableId }
      let META_COLS = []; // colonnes de tout le document
      let COLONNES = []; // colonnes de la table source
      let COLS = new Map(); // ref → colonne
      let MODELES = []; // lignes de Modeles_PDF
      let GALERIE = []; // { id, nom }
      let modele = null;
      let tableCourante = null;
      let tableLiee = null;
      let modeLie = false;
      let recsLies = [];
      let enregistrements = [];
      let index = 0;
      let pret = false;
      let enApercu = false;
      let chargement = false; // suspend la sauvegarde pendant un chargement
      let minuteur = null;
      let dernierJson = null;
      let ecritureEnCours = false;

      // ════════════════════════════════════════════════════════════════
      // Utilitaires
      // ════════════════════════════════════════════════════════════════
      const esc = (s) =>
        String(s ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        );
      const norm = (s) =>
        String(s ?? "")
          .normalize("NFD")
          .replace(/[\u0300-\u036f]/g, "")
          .toLowerCase();
      const attendre = (ms, v) =>
        new Promise((r) => setTimeout(() => r(v), ms));
      const typeBase = (type) => String(type || "Any").split(":")[0];
      const listeIds = (v) =>
        Array.isArray(v)
          ? (v[0] === "L" ? v.slice(1) : v).filter(Number.isInteger)
          : [];

      function statut(msg) {
        $("statut").textContent = msg || "";
      }
      function alerte(msg, niveau = "error") {
        $("alerte").innerHTML = msg
          ? `<div class="fr-alert fr-alert--${niveau} fr-alert--sm"><p>${esc(msg)}</p></div>`
          : "";
      }
      function etatSauvegarde(cle) {
        const t = {
          enregistre: `<i class="ri-check-line"></i>Enregistré`,
          encours: `<i class="ri-loader-4-line"></i>Enregistrement…`,
          modifie: `<i class="ri-pencil-line"></i>Modifié`,
          erreur: `<i class="ri-error-warning-line"></i>Non enregistré`,
          "": "",
        };
        $("etat-sauvegarde").innerHTML = t[cle] ?? "";
        $("etat-sauvegarde").style.color =
          cle === "erreur" ? "#CE0500" : "#666";
      }
      function colonnesEnLignes(t) {
        return t.id.map((id, i) => {
          const r = { id };
          for (const k in t) r[k] = t[k][i];
          return r;
        });
      }
      const memoire = {
        lire: (k) => {
          try {
            return localStorage.getItem(`publipostage:${k}`);
          } catch {
            return null;
          }
        },
        ecrire: (k, v) => {
          try {
            localStorage.setItem(`publipostage:${k}`, v);
          } catch {}
        },
      };

      // ════════════════════════════════════════════════════════════════
      // Pièces jointes Grist → blob URL
      // ════════════════════════════════════════════════════════════════
      let JETON = null;
      const CACHE_PJ = new Map();
      function jeton() {
        if (!JETON)
          JETON = grist.docApi.getAccessToken({ readOnly: true }).catch((e) => {
            JETON = null;
            throw e;
          });
        return JETON;
      }
      async function telechargerPJ(id, reessai = true) {
        const { token, baseUrl } = await jeton();
        const r = await fetch(
          `${baseUrl}/attachments/${id}/download?auth=${token}`,
        );
        if ((r.status === 401 || r.status === 403) && reessai) {
          JETON = null;
          return telechargerPJ(id, false);
        }
        if (!r.ok) throw new Error(`Pièce jointe ${id} : HTTP ${r.status}`);
        return URL.createObjectURL(await r.blob());
      }
      function urlPJ(id) {
        if (!CACHE_PJ.has(id))
          CACHE_PJ.set(
            id,
            telechargerPJ(id).catch((e) => {
              CACHE_PJ.delete(id);
              throw e;
            }),
          );
        return CACHE_PJ.get(id);
      }
      async function chargerGalerie() {
        GALERIE = [];
        try {
          const a = await grist.docApi.fetchTable("_grist_Attachments");
          const noms = new Map(a.id.map((id, i) => [id, a.fileName[i]]));
          const ids = new Set();
          MODELES.forEach((m) =>
            listeIds(m[COLS_MODELE.images]).forEach((id) => ids.add(id)),
          );
          GALERIE = [...ids].map((id) => ({
            id,
            nom: noms.get(id) || `Image ${id}`,
          }));
        } catch (e) {
          console.warn("Galerie indisponible :", e);
        }
      }

      // ════════════════════════════════════════════════════════════════
      // Métadonnées : tables et colonnes
      // ════════════════════════════════════════════════════════════════
      async function chargerMeta() {
        const [t, c] = await Promise.all([
          grist.docApi.fetchTable("_grist_Tables"),
          grist.docApi.fetchTable("_grist_Tables_column"),
        ]);
        TABLES = t.id
          .map((ref, i) => ({
            ref,
            tableId: t.tableId[i],
            resume: t.summarySourceTable[i],
          }))
          .filter(
            (x) =>
              !x.resume &&
              !x.tableId.startsWith("GristHidden_") &&
              x.tableId !== TABLE_MODELES,
          )
          .sort((a, b) => a.tableId.localeCompare(b.tableId));
        META_COLS = c.id.map((ref, i) => ({
          ref,
          parent: c.parentId[i],
          pos: c.parentPos[i],
          colId: c.colId[i],
          label: c.label[i] || c.colId[i],
          type: c.type[i],
          displayCol: c.displayCol[i],
        }));

        const refModeles = t.id.find((_, i) => t.tableId[i] === TABLE_MODELES);
        if (!refModeles)
          throw new Error(
            `La table ${TABLE_MODELES} est introuvable dans ce document.`,
          );
        const presentes = new Set(
          META_COLS.filter((c) => c.parent === refModeles).map((c) => c.colId),
        );
        const manquantes = Object.values(COLS_MODELE).filter(
          (c) => !presentes.has(c),
        );
        if (manquantes.length)
          throw new Error(
            `Colonnes manquantes dans ${TABLE_MODELES} : ${manquantes.join(", ")}`,
          );
      }
      function colonnesDe(tableRef) {
        const parRef = new Map(META_COLS.map((c) => [c.ref, c]));
        return META_COLS.filter(
          (c) =>
            c.parent === tableRef &&
            c.colId !== "manualSort" &&
            !c.colId.startsWith("gristHelper_") &&
            typeBase(c.type) !== "Attachments",
        )
          .sort((a, b) => a.pos - b.pos)
          .map((c) => ({
            ...c,
            displayColId: c.displayCol ? parRef.get(c.displayCol)?.colId : null,
          }));
      }

      // ════════════════════════════════════════════════════════════════
      // Valeurs : lecture et formatage
      // ════════════════════════════════════════════════════════════════
      function brute(rec, col) {
        if (!rec) return null;
        if (col.displayColId && col.displayColId in rec)
          return rec[col.displayColId];
        return rec[col.colId];
      }
      function formater(v, col) {
        const type = typeBase(col.type);
        if (v === false) return type === "Bool" ? "Non" : "";
        if (v === null || v === undefined || v === "") return "";
        if (Array.isArray(v) && typeof v[0] === "string" && v[0].length === 1) {
          const [code, a] = v;
          if (code === "L") {
            const sous = {
              ...col,
              type:
                type === "RefList"
                  ? "Ref"
                  : type === "ChoiceList"
                    ? "Choice"
                    : "Any",
            };
            return v
              .slice(1)
              .map((x) => formater(x, sous))
              .filter(Boolean)
              .join(", ");
          }
          if (code === "E") return "#Erreur";
          if (code === "d" || code === "D") v = new Date(a * 1000);
          else if (code === "R") return String(v[2]);
          else return "";
        } else if (Array.isArray(v)) {
          return v
            .map((x) => formater(x, { ...col, type: "Any" }))
            .filter(Boolean)
            .join(", ");
        }
        try {
          if (type === "Date") {
            const d =
              v instanceof Date
                ? v
                : typeof v === "number"
                  ? new Date(v * 1000)
                  : null;
            return d
              ? d.toLocaleDateString("fr-FR", { timeZone: "UTC" })
              : String(v);
          }
          if (type === "DateTime") {
            const d =
              v instanceof Date
                ? v
                : typeof v === "number"
                  ? new Date(v * 1000)
                  : null;
            const tz = String(col.type).split(":")[1] || undefined;
            return d
              ? d.toLocaleString("fr-FR", {
                  timeZone: tz,
                  dateStyle: "short",
                  timeStyle: "short",
                })
              : String(v);
          }
        } catch {
          return String(v);
        }
        if (type === "Bool") return v ? "Oui" : "Non";
        if (typeof v === "number") return v.toLocaleString("fr-FR");
        if (v instanceof Date) return v.toLocaleDateString("fr-FR");
        return String(v);
      }
      function libelleEnregistrement(rec, i) {
        const col = COLONNES[0];
        const txt = col ? formater(brute(rec, col), col) : "";
        return `${i + 1}. ${txt || `Ligne ${rec.id}`}`.slice(0, 80);
      }

      // ════════════════════════════════════════════════════════════════
      // Modèles : lecture et écriture dans Modeles_PDF
      // ════════════════════════════════════════════════════════════════
      async function chargerModeles() {
        MODELES = colonnesEnLignes(
          await grist.docApi.fetchTable(TABLE_MODELES),
        );
        trierModeles();
      }
      function trierModeles() {
        MODELES.sort((a, b) =>
          String(a[COLS_MODELE.nom] || "").localeCompare(
            String(b[COLS_MODELE.nom] || ""),
            "fr",
          ),
        );
      }
      function nomTable(ref) {
        return TABLES.find((t) => t.ref === ref)?.tableId || "";
      }
      function afficherModeles() {
        $("sel-modele").innerHTML = MODELES.length
          ? MODELES.map((m) => {
              const t =
                nomTable(m[COLS_MODELE.tableRef]) ||
                m[COLS_MODELE.tableNom] ||
                "";
              return `<option value="${m.id}">${esc(m[COLS_MODELE.nom] || "Sans nom")}${t ? ` — ${esc(t)}` : ""}</option>`;
            }).join("")
          : `<option value="">Aucun modèle</option>`;
        $("sel-modele").value = modele ? String(modele.id) : "";
        ["btn-dupliquer", "btn-renommer", "btn-supprimer"].forEach(
          (b) => ($(b).disabled = !modele),
        );
      }

      function imagesUtilisees() {
        const ids = new Set();
        editor?.state.doc.descendants((n) => {
          if (n.type.name === "image" && n.attrs.att) ids.add(n.attrs.att);
        });
        return ids;
      }
      // Les blob URL sont éphémères : seule la référence data-att est conservée
      function nettoyerBlobs(n) {
        if (Array.isArray(n)) return n.map(nettoyerBlobs);
        if (!n || typeof n !== "object") return n;
        const c = { ...n };
        if (c.type === "image" && c.attrs?.att)
          c.attrs = { ...c.attrs, src: null };
        if (c.content) c.content = nettoyerBlobs(c.content);
        return c;
      }

      function marquerModifie() {
        if (chargement) return;
        etatSauvegarde("modifie");
        clearTimeout(minuteur);
        minuteur = setTimeout(() => sauvegarder(), DELAI_SAUVEGARDE);
      }

      function champsCourants() {
        const conservees = new Set([
          ...listeIds(modele?.[COLS_MODELE.images]),
          ...imagesUtilisees(),
        ]);
        return {
          [COLS_MODELE.contenu]: JSON.stringify(
            nettoyerBlobs(editor.getJSON()),
          ),
          [COLS_MODELE.images]: ["L", ...conservees],
          [COLS_MODELE.tableRef]: tableCourante?.ref ?? null,
          [COLS_MODELE.tableNom]: tableCourante?.tableId ?? "",
        };
      }
      async function creerModele(nom, champs) {
        const c = {
          [COLS_MODELE.nom]: nom,
          [COLS_MODELE.mode]: "Fiche",
          ...champs,
        };
        const r = await grist.docApi.applyUserActions([
          ["AddRecord", TABLE_MODELES, null, c],
        ]);
        const m = { id: r.retValues[0], ...c };
        MODELES.push(m);
        trierModeles();
        return m;
      }

      // N'écrit QUE dans un modèle déjà ouvert : aucune création implicite.
      async function sauvegarder(force = false) {
        clearTimeout(minuteur);
        if (!editor || !modele || !pret || chargement || ecritureEnCours)
          return;
        const champs = champsCourants();
        const json = champs[COLS_MODELE.contenu];
        if (!force && json === dernierJson) return;
        ecritureEnCours = true;
        etatSauvegarde("encours");
        try {
          await grist.docApi.applyUserActions([
            ["UpdateRecord", TABLE_MODELES, modele.id, champs],
          ]);
          Object.assign(modele, champs);
          dernierJson = json;
          etatSauvegarde("enregistre");
        } catch (e) {
          console.error(e);
          etatSauvegarde("erreur");
          alerte(`Enregistrement impossible : ${e.message}`);
        } finally {
          ecritureEnCours = false;
        }
      }
      addEventListener("pagehide", () => sauvegarder());
      addEventListener("blur", () => sauvegarder());

      async function ouvrirModele(id) {
        await sauvegarder();
        modele = MODELES.find((m) => m.id === id) || null;
        chargement = true;
        try {
          let contenu = CONTENU_VIDE;
          if (modele?.[COLS_MODELE.contenu]) {
            try {
              contenu = JSON.parse(modele[COLS_MODELE.contenu]);
            } catch {
              alerte(
                "Le contenu de ce modèle est illisible : un document vide est affiché à la place.",
                "warning",
              );
            }
          }
          editor.commands.setContent(contenu, { emitUpdate: false });
          dernierJson = JSON.stringify(nettoyerBlobs(editor.getJSON()));
          const ref = modele?.[COLS_MODELE.tableRef];
          await choisirTable(
            TABLES.some((t) => t.ref === ref) ? ref : tableParDefaut(),
          );
        } finally {
          chargement = false;
        }
        afficherModeles();
        etatSauvegarde(modele ? "enregistre" : "");
        editor.setEditable(!!modele);
        $("feuille").style.opacity = modele ? "1" : ".5";
        alerte(
          modele ? "" : "Aucun modèle ouvert : cliquez sur + pour en créer un.",
          "info",
        );
        if (modele) memoire.ecrire("modele", String(modele.id));
        restaurerImages();
        majOutils();
      }

      // Recharge les pièces jointes dont la blob URL a expiré
      async function restaurerImages() {
        const aCharger = [];
        editor.state.doc.descendants((n, pos) => {
          if (
            n.type.name === "image" &&
            n.attrs.att &&
            !String(n.attrs.src || "").startsWith("blob:")
          )
            aCharger.push({ pos, att: n.attrs.att });
        });
        for (const { pos, att } of aCharger) {
          try {
            const src = await urlPJ(att);
            const n = editor.state.doc.nodeAt(pos);
            if (n?.type.name !== "image") continue;
            const etait = chargement;
            chargement = true;
            editor.view.dispatch(
              editor.state.tr.setNodeMarkup(pos, undefined, {
                ...n.attrs,
                src,
              }),
            );
            chargement = etait;
          } catch {
            console.warn(`Image ${att} indisponible`);
          }
        }
      }

      $("sel-modele").addEventListener("change", (e) =>
        ouvrirModele(Number(e.target.value)),
      );
      $("btn-nouveau").addEventListener("click", async () => {
        const nom = prompt("Nom du nouveau modèle :", "Nouveau modèle");
        if (nom === null) return;
        await sauvegarder();
        try {
          const m = await creerModele(nom.trim() || "Nouveau modèle", {
            [COLS_MODELE.contenu]: JSON.stringify(CONTENU_VIDE),
            [COLS_MODELE.tableRef]: tableCourante?.ref ?? null,
            [COLS_MODELE.tableNom]: tableCourante?.tableId ?? "",
          });
          await ouvrirModele(m.id);
        } catch (e) {
          alerte(`Création impossible : ${e.message}`);
        }
      });
      $("btn-dupliquer").addEventListener("click", async () => {
        if (!modele) return;
        const nom = prompt(
          "Nom de la copie :",
          `${modele[COLS_MODELE.nom] || "Modèle"} (copie)`,
        );
        if (nom === null) return;
        await sauvegarder(true);
        try {
          const champs = { ...modele };
          delete champs.id;
          delete champs[COLS_MODELE.nom];
          const m = await creerModele(nom.trim() || "Copie", champs);
          await ouvrirModele(m.id);
        } catch (e) {
          alerte(`Duplication impossible : ${e.message}`);
        }
      });
      $("btn-renommer").addEventListener("click", async () => {
        if (!modele) return;
        const nom = prompt("Nouveau nom :", modele[COLS_MODELE.nom] || "");
        if (nom === null || !nom.trim()) return;
        try {
          await grist.docApi.applyUserActions([
            [
              "UpdateRecord",
              TABLE_MODELES,
              modele.id,
              { [COLS_MODELE.nom]: nom.trim() },
            ],
          ]);
          modele[COLS_MODELE.nom] = nom.trim();
          trierModeles();
          afficherModeles();
        } catch (e) {
          alerte(`Renommage impossible : ${e.message}`);
        }
      });
      $("btn-supprimer").addEventListener("click", async () => {
        if (
          !modele ||
          !confirm(
            `Supprimer définitivement le modèle « ${modele[COLS_MODELE.nom]} » ? Cette action est irréversible.`,
          )
        )
          return;
        clearTimeout(minuteur);
        const id = modele.id;
        modele = null;
        try {
          await grist.docApi.applyUserActions([
            ["RemoveRecord", TABLE_MODELES, id],
          ]);
          MODELES = MODELES.filter((m) => m.id !== id);
          memoire.ecrire("modele", "");
          await ouvrirModele(MODELES[0]?.id ?? null);
        } catch (e) {
          alerte(`Suppression impossible : ${e.message}`);
        }
      });

      // ════════════════════════════════════════════════════════════════
      // Panneau des champs
      // ════════════════════════════════════════════════════════════════
      function afficherChamps() {
        const q = norm($("filtre-champs").value.trim());
        const liste = COLONNES.filter(
          (c) =>
            !q ||
            norm(c.label)
              .split(/\s+/)
              .some((w) => w.startsWith(q)) ||
            norm(c.colId).startsWith(q),
        );
        $("liste-champs").innerHTML = liste.length
          ? liste
              .map(
                (c) =>
                  `<button type="button" class="fr-tag fr-tag--sm" data-ref="${c.ref}" title="${esc(c.colId)} (${esc(typeBase(c.type))})"><i class="${ICONES_TYPE[typeBase(c.type)] || "ri-code-line"}"></i>${esc(c.label)}</button>`,
              )
              .join("")
          : `<p class="aide">${COLONNES.length ? "Aucun champ ne correspond." : "Choisissez une table source."}</p>`;
      }
      function insererBalise(col, chaine = editor.chain().focus()) {
        return chaine
          .insertContent([
            { type: "balise", attrs: { colRef: col.ref, label: col.label } },
            { type: "text", text: " " },
          ])
          .run();
      }

      // ════════════════════════════════════════════════════════════════
      // Autocomplétion @
      // ════════════════════════════════════════════════════════════════
      let suggestProps = null;
      let suggestIndex = 0;
      function dessinerSuggestion() {
        const menu = $("menu-suggest");
        if (!suggestProps) {
          menu.hidden = true;
          return;
        }
        const items = suggestProps.items;
        menu.innerHTML = items.length
          ? items
              .map(
                (c, i) =>
                  `<button type="button" class="suggest-item${i === suggestIndex ? " actif" : ""}" data-i="${i}"><i class="${ICONES_TYPE[typeBase(c.type)] || "ri-code-line"}"></i><span>${esc(c.label)}</span><small>${esc(c.colId)}</small></button>`,
              )
              .join("")
          : `<p class="vide">Aucun champ ne correspond.</p>`;
        menu.hidden = false;
        const r = suggestProps.clientRect?.();
        if (r) {
          const h = menu.offsetHeight;
          menu.style.left = `${Math.min(r.left, innerWidth - menu.offsetWidth - 8)}px`;
          menu.style.top = `${r.bottom + 4 + h > innerHeight ? r.top - h - 4 : r.bottom + 4}px`;
        }
      }
      function rendreSuggestion() {
        return {
          onStart(p) {
            suggestProps = p;
            suggestIndex = 0;
            dessinerSuggestion();
          },
          onUpdate(p) {
            suggestProps = p;
            suggestIndex = 0;
            dessinerSuggestion();
          },
          onKeyDown({ event }) {
            if (!suggestProps) return false;
            const n = suggestProps.items.length;
            if (event.key === "ArrowDown" && n) {
              suggestIndex = (suggestIndex + 1) % n;
              dessinerSuggestion();
              return true;
            }
            if (event.key === "ArrowUp" && n) {
              suggestIndex = (suggestIndex - 1 + n) % n;
              dessinerSuggestion();
              return true;
            }
            if ((event.key === "Enter" || event.key === "Tab") && n) {
              suggestProps.command(suggestProps.items[suggestIndex]);
              return true;
            }
            if (event.key === "Escape") {
              $("menu-suggest").hidden = true;
              return true;
            }
            return false;
          },
          onExit() {
            suggestProps = null;
            $("menu-suggest").hidden = true;
          },
        };
      }
      $("menu-suggest").addEventListener("mousedown", (e) => {
        const b = e.target.closest("[data-i]");
        if (!b || !suggestProps) return;
        e.preventDefault();
        suggestProps.command(suggestProps.items[Number(b.dataset.i)]);
      });

      // ════════════════════════════════════════════════════════════════
      // Éditeur TipTap
      // ════════════════════════════════════════════════════════════════
      function peindreTag(dom) {
        const col = COLS.get(Number(dom.dataset.colref));
        dom.className = col ? "balise" : "balise balise-orpheline";
        dom.textContent = col
          ? col.label
          : dom.dataset.label || "Champ inconnu";
        dom.title = col
          ? `Champ : ${col.colId}`
          : "Ce champ n'existe pas dans la table source";
      }
      function rafraichirTags() {
        editor?.view.dom.querySelectorAll(".balise").forEach(peindreTag);
      }

      async function initEditeur() {
        const [core, sk, im, tb, al, sg] = await Promise.all(
          Object.values(TIPTAP_URLS).map((u) => import(u)),
        );
        const { Editor, Node, mergeAttributes } = core;
        const StarterKit = sk.StarterKit ?? sk.default;
        const Suggestion = sg.Suggestion ?? sg.default;

        const Balise = Node.create({
          name: "balise",
          group: "inline",
          inline: true,
          atom: true,
          selectable: true,
          draggable: true,
          addAttributes() {
            return {
              colRef: {
                default: null,
                parseHTML: (el) =>
                  Number(el.getAttribute("data-colref")) || null,
                renderHTML: (a) => ({ "data-colref": a.colRef }),
              },
              label: {
                default: "",
                parseHTML: (el) =>
                  el.getAttribute("data-label") || el.textContent,
                renderHTML: (a) => ({ "data-label": a.label }),
              },
            };
          },
          parseHTML() {
            return [{ tag: "span[data-colref]" }];
          },
          renderHTML({ node, HTMLAttributes }) {
            return [
              "span",
              mergeAttributes(HTMLAttributes, { class: "balise" }),
              COLS.get(node.attrs.colRef)?.label || node.attrs.label || "?",
            ];
          },
          renderText({ node }) {
            return `[${COLS.get(node.attrs.colRef)?.label || node.attrs.label}]`;
          },
          addNodeView() {
            return ({ node }) => {
              const dom = document.createElement("span");
              dom.contentEditable = "false";
              const peindre = (n) => {
                dom.dataset.colref = n.attrs.colRef;
                dom.dataset.label = n.attrs.label;
                peindreTag(dom);
              };
              peindre(node);
              return {
                dom,
                update: (n) =>
                  n.type.name === "balise" ? (peindre(n), true) : false,
              };
            };
          },
          addProseMirrorPlugins() {
            return [
              Suggestion({
                editor: this.editor,
                char: "@",
                items: ({ query }) => {
                  const q = norm(query);
                  return COLONNES.filter(
                    (c) =>
                      !q ||
                      norm(c.label)
                        .split(/\s+/)
                        .some((w) => w.startsWith(q)) ||
                      norm(c.colId).startsWith(q),
                  ).slice(0, 12);
                },
                command: ({ editor: ed, range, props }) =>
                  insererBalise(props, ed.chain().focus().deleteRange(range)),
                render: rendreSuggestion,
              }),
            ];
          },
        });

        const SautPage = Node.create({
          name: "sautPage",
          group: "block",
          atom: true,
          selectable: true,
          parseHTML() {
            return [{ tag: "div[data-saut-page]" }];
          },
          renderHTML() {
            return ["div", { "data-saut-page": "", class: "saut-page" }];
          },
        });

        const ImagePJ = im.Image.extend({
          addAttributes() {
            return {
              ...this.parent?.(),
              att: {
                default: null,
                parseHTML: (el) => Number(el.getAttribute("data-att")) || null,
                renderHTML: (a) => (a.att ? { "data-att": a.att } : {}),
              },
            };
          },
        }).configure({
          resize: {
            enabled: true,
            directions: ["bottom-right", "bottom-left"],
            minWidth: 30,
            alwaysPreserveAspectRatio: true,
          },
        });

        editor = new Editor({
          element: $("editeur"),
          extensions: [
            StarterKit.configure({ link: { openOnClick: false } }),
            al.TextAlign.configure({ types: ["heading", "paragraph"] }),
            tb.TableKit,
            ImagePJ,
            Balise,
            SautPage,
          ],
          content: CONTENU_VIDE,
        });
        editor.on("transaction", majOutils);
        editor.on("update", marquerModifie);
      }

      // ── Barre d'outils ──
      const CMD = {
        annuler: (c) => c.undo(),
        retablir: (c) => c.redo(),
        gras: (c) => c.toggleBold(),
        italique: (c) => c.toggleItalic(),
        souligne: (c) => c.toggleUnderline(),
        barre: (c) => c.toggleStrike(),
        gauche: (c) => c.setTextAlign("left"),
        centre: (c) => c.setTextAlign("center"),
        droite: (c) => c.setTextAlign("right"),
        justifie: (c) => c.setTextAlign("justify"),
        puces: (c) => c.toggleBulletList(),
        numeros: (c) => c.toggleOrderedList(),
        tableau: (c) =>
          c.insertTable({ rows: 3, cols: 3, withHeaderRow: true }),
        ligne: (c) => c.addRowAfter(),
        colonne: (c) => c.addColumnAfter(),
        supprLigne: (c) => c.deleteRow(),
        supprColonne: (c) => c.deleteColumn(),
        supprTableau: (c) => c.deleteTable(),
        saut: (c) => c.insertContent({ type: "sautPage" }),
        effacer: (c) => c.unsetAllMarks().clearNodes(),
      };
      const ACTIF = {
        gras: ["bold"],
        italique: ["italic"],
        souligne: ["underline"],
        barre: ["strike"],
        gauche: [{ textAlign: "left" }],
        centre: [{ textAlign: "center" }],
        droite: [{ textAlign: "right" }],
        justifie: [{ textAlign: "justify" }],
        puces: ["bulletList"],
        numeros: ["orderedList"],
      };
      function majOutils() {
        if (!editor || enApercu) return;
        const dansTableau = editor.isActive("table");
        document.querySelectorAll("#outils [data-cmd]").forEach((b) => {
          const a = ACTIF[b.dataset.cmd];
          b.classList.toggle("actif", !!a && editor.isActive(...a));
          if (b.hasAttribute("data-table")) b.disabled = !dansTableau;
        });
        $("sel-style").value =
          [1, 2, 3].find((l) => editor.isActive("heading", { level: l })) ??
          "p";
        $("btn-lien").classList.toggle("actif", editor.isActive("link"));
      }
      $("outils").addEventListener("mousedown", (e) => {
        if (e.target.closest("button")) e.preventDefault();
      });
      $("outils").addEventListener("click", (e) => {
        const b = e.target.closest("[data-cmd]");
        if (b && editor && !b.disabled)
          CMD[b.dataset.cmd](editor.chain().focus()).run();
      });
      $("sel-style").addEventListener("change", (e) => {
        const v = e.target.value,
          c = editor.chain().focus();
        (v === "p"
          ? c.setParagraph()
          : c.setHeading({ level: Number(v) })
        ).run();
      });

      // ── Menus flottants ──
      function ouvrirPop(pop, bouton) {
        document
          .querySelectorAll(".pop:not(.suggest)")
          .forEach((p) => p !== pop && (p.hidden = true));
        pop.hidden = !pop.hidden;
        if (pop.hidden) return;
        const r = bouton.getBoundingClientRect();
        pop.style.left = `${Math.min(r.left, innerWidth - pop.offsetWidth - 8)}px`;
        pop.style.top = `${r.bottom + 4}px`;
      }
      document.addEventListener("mousedown", (e) => {
        if (!e.target.closest(".pop, #btn-images, #btn-emoji, #btn-lien"))
          document
            .querySelectorAll(".pop:not(.suggest)")
            .forEach((p) => (p.hidden = true));
      });

      $("pop-emoji").innerHTML = EMOJIS.map(
        (e) => `<button type="button">${e}</button>`,
      ).join("");
      $("pop-emoji").addEventListener("mousedown", (e) => e.preventDefault());
      $("pop-emoji").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (b) {
          editor.chain().focus().insertContent(b.textContent).run();
          $("pop-emoji").hidden = true;
        }
      });
      $("btn-emoji").addEventListener("click", () =>
        ouvrirPop($("pop-emoji"), $("btn-emoji")),
      );

      $("btn-lien").addEventListener("click", () => {
        const pop = $("pop-lien");
        ouvrirPop(pop, $("btn-lien"));
        if (pop.hidden) return;
        $("champ-lien").value = editor.getAttributes("link").href || "";
        $("btn-lien-suppr").disabled = !editor.isActive("link");
        $("champ-lien").focus();
      });
      $("pop-lien").addEventListener("mousedown", (e) => {
        if (e.target.tagName !== "INPUT") e.preventDefault();
      });
      function appliquerLien() {
        let href = $("champ-lien").value.trim();
        const c = editor.chain().focus().extendMarkRange("link");
        if (!href) c.unsetLink().run();
        else {
          if (!/^(https?:|mailto:|tel:)/i.test(href)) href = `https://${href}`;
          if (editor.state.selection.empty && !editor.isActive("link"))
            c.insertContent(`<a href="${esc(href)}">${esc(href)}</a> `).run();
          else c.setLink({ href }).run();
        }
        $("pop-lien").hidden = true;
      }
      $("btn-lien-ok").addEventListener("click", appliquerLien);
      $("btn-lien-suppr").addEventListener("click", () => {
        editor.chain().focus().extendMarkRange("link").unsetLink().run();
        $("pop-lien").hidden = true;
      });
      $("champ-lien").addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          appliquerLien();
        }
        if (e.key === "Escape") {
          $("pop-lien").hidden = true;
          editor.commands.focus();
        }
      });

      $("btn-images").addEventListener("click", async () => {
        const pop = $("pop-images");
        if (!GALERIE.length) {
          pop.innerHTML = `<p class="vide">Aucune image disponible. Déposez des fichiers dans la colonne ${COLS_MODELE.images} de la table ${TABLE_MODELES}, puis cliquez sur Actualiser.</p>`;
          return ouvrirPop(pop, $("btn-images"));
        }
        pop.innerHTML = `<div class="galerie">${GALERIE.map((g) => `<button type="button" data-att="${g.id}" title="${esc(g.nom)}"><img alt="${esc(g.nom)}"></button>`).join("")}</div>`;
        ouvrirPop(pop, $("btn-images"));
        for (const b of pop.querySelectorAll("[data-att]")) {
          urlPJ(Number(b.dataset.att))
            .then((u) => (b.querySelector("img").src = u))
            .catch(() => (b.title = "Image indisponible"));
        }
      });
      $("pop-images").addEventListener("mousedown", (e) => e.preventDefault());
      $("pop-images").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-att]");
        if (!b) return;
        const id = Number(b.dataset.att),
          img = b.querySelector("img");
        const src = await urlPJ(id);
        editor
          .chain()
          .focus()
          .setImage({
            src,
            att: id,
            alt: b.title,
            width: img.naturalWidth ? Math.min(img.naturalWidth, 250) : 200,
          })
          .run();
        $("pop-images").hidden = true;
      });

      // ════════════════════════════════════════════════════════════════
      // Table source et enregistrements
      // ════════════════════════════════════════════════════════════════
      function tableParDefaut() {
        return (
          TABLES.find((t) => t.tableId === tableLiee)?.ref ??
          TABLES[0]?.ref ??
          null
        );
      }
      async function choisirTable(ref) {
        tableCourante = TABLES.find((t) => t.ref === ref) || null;
        $("sel-table").value = tableCourante ? String(tableCourante.ref) : "";
        COLONNES = tableCourante ? colonnesDe(tableCourante.ref) : [];
        COLS = new Map(COLONNES.map((c) => [c.ref, c]));
        afficherChamps();
        rafraichirTags();
        await chargerEnregistrements();
      }
      async function chargerEnregistrements() {
        const idCourant = enregistrements[index]?.id;
        modeLie = !!tableCourante && tableLiee === tableCourante.tableId;
        if (!tableCourante) enregistrements = [];
        else if (modeLie) enregistrements = recsLies;
        else {
          statut("Chargement des données…");
          enregistrements = colonnesEnLignes(
            await grist.docApi.fetchTable(tableCourante.tableId),
          );
          statut("");
        }
        const i = enregistrements.findIndex((r) => r.id === idCourant);
        index = i >= 0 ? i : 0;
        majMode();
        majNav();
      }
      function majMode() {
        const b = $("badge-mode");
        if (!tableCourante) {
          b.className = "fr-badge fr-badge--sm";
          b.textContent = "Aucune table";
          return;
        }
        b.className = `fr-badge fr-badge--sm ${modeLie ? "fr-badge--info" : "fr-badge--new"}`;
        b.textContent = modeLie ? "Suit la vue" : "Table indépendante";
        b.title = modeLie
          ? "Le widget suit la ligne sélectionnée et respecte les filtres de la vue."
          : "Le widget n'est pas lié à cette table : choisissez l'enregistrement dans la liste.";
      }
      function majNav() {
        const n = enregistrements.length;
        $("sel-rec").innerHTML = n
          ? enregistrements
              .map(
                (r, i) =>
                  `<option value="${i}">${esc(libelleEnregistrement(r, i))}</option>`,
              )
              .join("")
          : `<option>Aucun enregistrement</option>`;
        $("sel-rec").value = String(index);
        $("compteur").textContent = n ? `${index + 1} / ${n}` : "";
        $("btn-prec").disabled = index <= 0;
        $("btn-suiv").disabled = index >= n - 1;
        $("btn-imprimer").disabled = !n;
        $("btn-imprimer-tout").disabled = !n;
        $("btn-imprimer-tout").innerHTML =
          `<i class="ri-stack-line"></i>&nbsp;Tout imprimer (${n})`;
        if (enApercu) rafraichirApercu();
      }
      function allerA(i) {
        if (i < 0 || i >= enregistrements.length) return;
        index = i;
        majNav();
        if (modeLie)
          grist.setCursorPos({ rowId: enregistrements[i].id }).catch(() => {});
      }
      $("btn-prec").addEventListener("click", () => allerA(index - 1));
      $("btn-suiv").addEventListener("click", () => allerA(index + 1));
      $("sel-rec").addEventListener("change", (e) =>
        allerA(Number(e.target.value)),
      );
      $("sel-table").addEventListener("change", async (e) => {
        await choisirTable(Number(e.target.value));
        sauvegarder(true);
      });
      $("filtre-champs").addEventListener("input", afficherChamps);
      $("liste-champs").addEventListener("click", (e) => {
        const b = e.target.closest("[data-ref]");
        if (b && editor) insererBalise(COLS.get(Number(b.dataset.ref)));
      });

      // ════════════════════════════════════════════════════════════════
      // Rendu, aperçu et impression
      // ════════════════════════════════════════════════════════════════
      function cssContenu(s) {
        return `
  ${s} { font-family: "Marianne", arial, sans-serif; font-size: 11pt; line-height: 1.5; color: #161616; }
  ${s} h1 { font-size: 20pt; line-height: 1.25; font-weight: 700; margin: 0 0 4mm; color: #161616; }
  ${s} h2 { font-size: 15pt; line-height: 1.3; font-weight: 700; margin: 5mm 0 3mm; color: #161616; }
  ${s} h3 { font-size: 12.5pt; line-height: 1.35; font-weight: 700; margin: 4mm 0 2mm; color: #161616; }
  ${s} p { margin: 0 0 3mm; font-size: inherit; line-height: inherit; }
  ${s} p:empty { min-height: 1.5em; }
  ${s} ul, ${s} ol { margin: 0 0 3mm; padding-left: 6mm; }
  ${s} ul { list-style-type: disc; }
  ${s} ol { list-style-type: decimal; }
  ${s} li { margin: 0; padding: 0; }
  ${s} li::marker { font-weight: 400; }
  ${s} li > p { margin: 0; }
  ${s} table { border-collapse: collapse; margin: 0 0 3mm; }
  ${s} th, ${s} td { border: 1px solid #929292; padding: 1.5mm 2.5mm; text-align: left; vertical-align: top; min-width: 2em; }
  ${s} th { background: #EEEEEE; font-weight: 700; }
  ${s} td > p, ${s} th > p { margin: 0; }
  ${s} img { max-width: 100%; height: auto; }
  ${s} a { color: #000091; }`;
      }
      document.head.insertAdjacentHTML(
        "beforeend",
        `<style>${cssContenu(".feuille .ProseMirror")}</style>`,
      );

      const CSS_IMPRESSION = `
  @font-face { font-family: "Marianne"; font-weight: 400; src: url("${FONTS_URL}Marianne-Regular.woff2") format("woff2"); }
  @font-face { font-family: "Marianne"; font-weight: 400; font-style: italic; src: url("${FONTS_URL}Marianne-Regular_Italic.woff2") format("woff2"); }
  @font-face { font-family: "Marianne"; font-weight: 500; src: url("${FONTS_URL}Marianne-Medium.woff2") format("woff2"); }
  @font-face { font-family: "Marianne"; font-weight: 700; src: url("${FONTS_URL}Marianne-Bold.woff2") format("woff2"); }
  @font-face { font-family: "Marianne"; font-weight: 700; font-style: italic; src: url("${FONTS_URL}Marianne-Bold_Italic.woff2") format("woff2"); }
  @page {
    size: A4; margin: 20mm 20mm 22mm;
    @bottom-left  { content: "${PIED_GAUCHE}"; font: 8pt "Marianne", arial, sans-serif; color: #666; }
    @bottom-right { content: "Page " counter(page) "/" counter(pages); font: 8pt "Marianne", arial, sans-serif; color: #666; }
  }
  html, body { margin: 0; }
  @media screen { body { padding: 20mm; } }
  ${cssContenu("body")}
  th { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  thead { display: table-header-group; }
  tr, img { break-inside: avoid; }
  h1, h2, h3 { break-after: avoid; }
  .saut-page { break-before: page; height: 0; margin: 0; border: 0; }
  .fiche + .fiche { break-before: page; }
  .valeur { white-space: pre-line; }
`;
      const POLICES = [
        "400 16px Marianne",
        "italic 400 16px Marianne",
        "700 16px Marianne",
        "italic 700 16px Marianne",
      ];

      function documentImpression(corps) {
        return `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${esc(modele?.[COLS_MODELE.nom] || "Document")}</title>
    <style>${CSS_IMPRESSION}</style></head><body>${corps}</body></html>`;
      }
      async function attendreRessources(doc) {
        await Promise.all(
          POLICES.map((f) => doc.fonts.load(f).catch(() => {})),
        );
        await doc.fonts.ready;
        await Promise.all(
          [...doc.images].map((i) => i.decode().catch(() => {})),
        );
      }
      async function htmlModele() {
        const tmp = document.createElement("div");
        tmp.innerHTML = editor.getHTML();
        await Promise.all(
          [...tmp.querySelectorAll("img[data-att]")].map(async (img) => {
            try {
              img.src = await urlPJ(Number(img.dataset.att));
            } catch {
              img.removeAttribute("src");
              img.alt = "Image indisponible";
            }
          }),
        );
        return tmp.innerHTML;
      }
      function fusionner(html, rec) {
        const tmp = document.createElement("div");
        tmp.innerHTML = html;
        tmp.querySelectorAll("span[data-colref]").forEach((el) => {
          const col = COLS.get(Number(el.dataset.colref));
          const span = document.createElement("span");
          span.className = "valeur";
          span.textContent = col
            ? formater(brute(rec, col), col)
            : `[${el.dataset.label || "champ introuvable"}]`;
          el.replaceWith(span);
        });
        return tmp.innerHTML;
      }
      async function imprimer(recs) {
        statut("Préparation de l'impression…");
        try {
          const base = await htmlModele();
          const corps = recs
            .map(
              (r) => `<section class="fiche">${fusionner(base, r)}</section>`,
            )
            .join("");
          $("frame-impression")?.remove();
          const frame = document.createElement("iframe");
          frame.id = "frame-impression";
          frame.style.cssText =
            "position:fixed;right:0;bottom:0;width:0;height:0;border:0";
          const charge = new Promise((r) => (frame.onload = r));
          frame.srcdoc = documentImpression(corps);
          document.body.appendChild(frame);
          await charge;
          await attendreRessources(frame.contentDocument);
          statut("");
          frame.contentWindow.focus();
          frame.contentWindow.print();
        } catch (e) {
          console.error(e);
          statut("");
          alerte(`Impression impossible : ${e.message}`);
        }
      }
      async function rafraichirApercu() {
        const f = $("apercu");
        const charge = new Promise((r) => (f.onload = r));
        f.srcdoc = documentImpression(
          `<section class="fiche">${fusionner(await htmlModele(), enregistrements[index])}</section>`,
        );
        await charge;
        await attendreRessources(f.contentDocument);
        f.style.height = `${f.contentDocument.documentElement.scrollHeight}px`;
      }
      function basculerApercu() {
        enApercu = !enApercu;
        $("feuille").hidden = enApercu;
        $("apercu").hidden = !enApercu;
        $("outils")
          .querySelectorAll("button, select")
          .forEach((b) => (b.disabled = enApercu));
        $("btn-apercu").innerHTML = enApercu
          ? `<i class="ri-edit-line"></i>&nbsp;Modifier`
          : `<i class="ri-eye-line"></i>&nbsp;Aperçu`;
        if (enApercu) rafraichirApercu();
        else majOutils();
      }
      $("btn-apercu").addEventListener("click", basculerApercu);
      $("btn-imprimer").addEventListener(
        "click",
        () => enregistrements[index] && imprimer([enregistrements[index]]),
      );
      $("btn-imprimer-tout").addEventListener("click", () => {
        const n = enregistrements.length;
        if (
          n > 100 &&
          !confirm(
            `Préparer un document de ${n} fiches ? Cela peut prendre un moment.`,
          )
        )
          return;
        imprimer(enregistrements);
      });
      $("btn-actualiser").addEventListener("click", async () => {
        statut("Actualisation…");
        try {
          await sauvegarder();
          await chargerMeta();
          await chargerModeles();
          await chargerGalerie();
          remplirTables();
          const id =
            modele && MODELES.some((m) => m.id === modele.id)
              ? modele.id
              : (MODELES[0]?.id ?? null);
          modele = null;
          await ouvrirModele(id);
          alerte("");
        } catch (e) {
          alerte(`Actualisation impossible : ${e.message}`);
        }
        statut("");
      });

      // ════════════════════════════════════════════════════════════════
      // Grist
      // ════════════════════════════════════════════════════════════════
      function remplirTables() {
        $("sel-table").innerHTML = TABLES.length
          ? TABLES.map(
              (t) => `<option value="${t.ref}">${esc(t.tableId)}</option>`,
            ).join("")
          : `<option value="">Aucune table</option>`;
      }

      grist.ready({ requiredAccess: "full" });

      grist.onRecords(
        async (recs) => {
          recsLies = recs || [];
          tableLiee = grist.getSelectedTableIdSync?.() ?? tableLiee;
          if (pret && tableCourante && tableCourante.tableId === tableLiee)
            await chargerEnregistrements();
        },
        { includeColumns: "normal" },
      );

      grist.onRecord(
        (rec) => {
          if (!pret || !modeLie || !rec) return;
          const i = enregistrements.findIndex((r) => r.id === rec.id);
          if (i >= 0 && i !== index) {
            index = i;
            majNav();
          }
        },
        { includeColumns: "normal" },
      );

      async function init() {
        statut("Chargement…");
        try {
          await chargerMeta();
          await chargerModeles();
        } catch (e) {
          statut("");
          return alerte(
            /accès|access|permission/i.test(e.message)
              ? "Le widget doit avoir l'accès complet au document (panneau de droite, « Accès du widget »)."
              : e.message,
          );
        }
        tableLiee = await Promise.race([
          grist.getSelectedTableId(),
          attendre(2500, null),
        ]);
        try {
          await Promise.all([initEditeur(), chargerGalerie()]);
        } catch (e) {
          console.error(e);
          statut("");
          return alerte(`Chargement de l'éditeur impossible : ${e.message}`);
        }
        remplirTables();
        const memorise = Number(memoire.lire("modele"));
        const id = MODELES.some((m) => m.id === memorise)
          ? memorise
          : (MODELES.find(
              (m) => nomTable(m[COLS_MODELE.tableRef]) === tableLiee,
            )?.id ??
            MODELES[0]?.id ??
            null);
        await ouvrirModele(id);
        pret = true;
        statut("");
      }
      init();
    </script>
  </body>
</html>
